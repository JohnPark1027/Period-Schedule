<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b8557b"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Period Schedule</title><style>body{margin:0;background:#fff5f8;color:#422739;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:520px;margin:auto;padding:22px}h1{color:#a93d68}.panel{background:white;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 3px 18px #ad54791c}label{display:block;margin:12px 0 5px}input,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #e6cbd5}button{background:#ad416b;color:white;border:0;cursor:pointer;margin:6px 4px 6px 0}.muted{color:#826a76;font-size:13px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{text-align:center;padding:9px 0;border-radius:9px;font-size:13px}.period{background:#ef9ebd}.predicted{background:#f8d8e4}.today{outline:2px solid #b8557b}.nav{display:flex;justify-content:space-between;align-items:center}.head{font-weight:600;color:#947784}ul{padding-left:20px}li{margin:8px 0}</style></head><body><main class="app"><h1>🌷 Period Schedule</h1><p>나만의 생리 주기 달력</p><section class="panel"><label for="start">생리 시작일</label><input id="start" type="date"><label for="cycle">평균 주기 (일)</label><input id="cycle" type="number" min="15" max="90" value="28"><label for="duration">생리 기간 (일)</label><input id="duration" type="number" min="1" max="14" value="7"><p><button id="save">시작일 기록하기</button><button id="export">기록 백업</button></p><label for="import">백업 파일 복원</label><input id="import" type="file" accept="application/json"><p class="muted">기록은 이 기기의 브라우저에만 저장돼요. 기기 변경 전 백업하세요.</p></section><section class="panel"><div class="nav"><button id="prev" aria-label="이전 달">‹</button><strong id="month"></strong><button id="next" aria-label="다음 달">›</button></div><div class="grid" id="calendar"></div><p class="muted">진한 분홍: 기록된 생리 · 연분홍: 예상 기간</p></section><section class="panel"><h2>다음 예정일</h2><strong id="nextdate">시작일을 기록해 주세요.</strong><p id="countdown"></p><h3>알림 일정</h3><ul id="alerts"></ul><p class="muted">D-5, D-3, D-1, 당일, 경과 상태를 앱에서 확인할 수 있어요. 앱을 닫은 상태의 자동 푸시 알림은 아직 지원하지 않아요.</p></section><section class="panel"><h3>기록</h3><ul id="records"></ul><p class="muted">예상일은 참고용이며 피임이나 임신 여부 판단에 사용하면 안 돼요.</p></section></main><script src="app.js"></script></body></html>
